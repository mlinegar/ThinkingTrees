name = "lean3"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FormalProofs", "FormalProofsEconometrics"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false  # Disabled: we use custom patterns not matching mathlib style
maxSynthPendingDepth = 3
linter.unusedSectionVars = false
linter.unusedVariables = false
linter.unusedSimpArgs = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0-rc1"

[[require]]
name = "FormalProbability"
# NOTE (release hygiene): this project depends on the companion `FormalProbability` library.
# In this monorepo, it is expected to be checked out as a sibling of `ThinkingTrees/`:
#   ../../FormalProbability
# If you publish a standalone repo, prefer either:
# - vendoring `FormalProbability/` into the repo and switching this to a relative in-repo path, or
# - pointing `git = ...` at a revision that includes the required modules.
path = "../../FormalProbability"

[[lean_lib]]
name = "FormalProofs"

# Quarantined legacy econometrics subtree: kept out of the FormalProofs
# umbrella (namespace clash with FormalProbability.Econometrics.*) but built
# as its own target so it cannot bitrot. See FormalProofs/Econometrics.lean.
[[lean_lib]]
name = "FormalProofsEconometrics"
roots = ["FormalProofs.Econometrics"]
