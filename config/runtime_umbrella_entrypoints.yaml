    status: canonical_sidecar
  - path: scripts/run_treepo_stack_markov_demo.py
    status: canonical_sidecar

adapter_covered:
  - path: scripts/run_experiment.py
    adapter: experiment_control_plane
  - glob: scripts/report_*.py
    adapter: report_only
    notes: Report scripts remain legacy unless listed as supported.
  - glob: scripts/plot_*.py
    adapter: legacy_plot_artifact
  - glob: scripts/build_*.py
    adapter: legacy_command_builder
  - glob: scripts/launch_*.py
    adapter: legacy_launcher

