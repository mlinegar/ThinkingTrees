version: 1

supported:
  - path: scripts/run_runtime_eval.py
    status: canonical
    notes: Runtime-eval v2 roles, calls, metrics, predictions, steps.
  - path: scripts/audit_runtime_umbrella_coverage.py
    status: canonical_tool
    notes: Release gate for supported, adapter-covered, and legacy script inventory.
  - path: scripts/check_repo_release_hygiene.py
    status: canonical_tool
    notes: Release gate for generated artifacts, local paths, and stale public runtime flags.
  - path: scripts/run_v1_launch_checks.py
    status: canonical_sidecar
    notes: Local v1 readiness gate over audit, LongBench fixture runtime eval, and focused tests.
  - path: scripts/report_runtime_v1_results.py
    status: canonical_sidecar
    notes: Paper-facing method and slice matrix over runtime predictions/results.
