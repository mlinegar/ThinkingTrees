[publication_bundle]
phases = ["tradeoff", "parity", "tree_fno_pdf", "full_doc_parity_pdf", "bundle"]
with_preflight = true
reuse_existing = false

[publication_bundle.tradeoff]
preset = "standard"
device_mode = "cuda"
phases = ["supervision_recovery", "report"]
train_docs = 10240
supervision_recovery_train_docs = [1024, 2048, 4096]
supervision_recovery_seeds = [0, 1]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_structural_cell = "r12_p079"

[publication_bundle.tradeoff.tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"

[publication_bundle.tradeoff.structural_tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"

[publication_bundle.tradeoff.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 2

[publication_bundle.parity]
benchmark = "recoverable_v4"
gate_train_doc_count = 10240
scale_train_doc_counts = [1024, 2048, 3072, 4096, 5120, 8192, 10240]
seeds = [0, 1, 2, 3, 4]
run_aux_upper_bound = true
upper_bound_aux_fractions = [0.25, 1.0]
backfill_on_success = true

[publication_bundle.parity.runtime]
data_mode = "resident"
bucket_mode = "exact_then_bucketed"
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = false
capacity_workers_per_mig = 2

[[publication_bundle.parity.method_runs]]
problem_id = "markov_ops_count"
method_id = "tree_neural"
law_set_id = "on_range_idempotence_only"
role = "primary"

[[publication_bundle.parity.method_runs]]
problem_id = "markov_ops_count"
method_id = "tree_neural"
law_set_id = "merge_and_on_range_idempotence"
role = "primary"

[[publication_bundle.parity.method_runs]]
problem_id = "markov_ops_count"
method_id = "tree_neural"
law_set_id = "all"
role = "primary"

[[publication_bundle.parity.reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno"
law_set_id = "all"
role = "reference"

[[publication_bundle.parity.reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno_sumlen"
law_set_id = "all"
role = "reference"

[publication_bundle.render]
render_full_doc_parity_pdf = true

[publication_bundle.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1

[tradeoff_pipeline]
preset = "standard"
phases = ["supervision_recovery", "report"]
train_docs = 10240
val_docs = 1024
test_docs = 1024
supervision_recovery_train_docs = [1024, 2048, 4096]
supervision_recovery_seeds = [0, 1]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_structural_cell = "r12_p079"
docs_epochs_train_docs = [5120, 10240]
docs_epochs_epochs = [1, 2, 5, 10]
learnability_train_docs = [5120, 10240]
learnability_weights = [0.0, 0.25, 0.5, 1.0]
learnability_profiles = ["pure_c2", "equal"]
weight_ablation_train_docs = [5120, 10240]
weight_ablation_profiles = ["root_only", "pure_c2", "c2_trace_c1c3", "c2_light_c1c3", "c2_mild_c1c3", "c2_moderate_c1c3", "c2_very_dominant", "c2_dominant", "c2_heavy", "equal", "c1c3_heavy", "c3_dominant", "no_c2"]
law_set_ids = ["root_only", "on_range_idempotence_only", "all"]
full_doc_anchor_train_docs = [5120, 10240]
full_doc_anchor_seeds = [0, 1, 2, 3, 4]
efficiency_anchor_mode = "both"
efficiency_train_docs = [2048, 4096, 5120, 10240]
efficiency_anchor_train_docs_dense = [256, 512, 768, 1024, 1536, 2048, 3072, 4096, 5120, 10240]
