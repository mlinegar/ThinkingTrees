# True-128 one-leaf supervision-recovery debug run for R100 and
# mass-matched local-label packages. This isolates the repaired manifest mass
# accounting without mixing leaf geometries.
[tradeoff_pipeline]
preset = "standard"
phases = ["supervision_recovery", "report"]
device_mode = "cuda"
train_docs = 10240
val_docs = 1024
test_docs = 1024
supervision_recovery_train_docs = [1024, 4096, 10240]
supervision_recovery_seeds = [0]
supervision_recovery_depth_discount_gammas = [1.0]
supervision_recovery_packages = [
  "full100",
  "r100_mass_local_eq_10p0",
  "r100_mass_local_eq_15p0",
  "r100_mass_local_eq_20p0",
]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_recoverable_benchmark = "recoverable_v5_t128"
supervision_recovery_structural_grid = "structural_core_v2_t128"
supervision_recovery_structural_cell = "r12_p079"
supervision_fixed_leaf_tokens = 128
supervision_recovery_leaf_token_ladder = [128]
supervision_min_tokens = 128
supervision_max_tokens = 128
supervision_epochs = 40
exact_metric_final_doc_limit = 128
tree_posttrain_train_doc_limit = 128
prepared_data_root = "outputs/_prepared_data/markov_full_doc_anchor_diagnostics_t128_relaunch"
tree_stage1_artifact_root = "outputs/_stage1_artifacts/markov_supervision_recovery_unified_g_leaf128_r100_debug"

[tradeoff_pipeline.tree_reference]
mode = "preset"
preset = "unified_g_full_local_laws_v1"

[tradeoff_pipeline.structural_tree_reference]
mode = "preset"
preset = "unified_g_full_local_laws_v1"

# Apply the strict 1-leaf FNO-parity preset only to the exact-collapse
# `full100` package. Mass-matched local-label packages stay on the standard
# unified-g preset above.
[tradeoff_pipeline.one_leaf_tree_reference]
mode = "preset"
preset = "unified_g_fno_parity_canary_v1"

[tradeoff_pipeline.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
tree_batch_structural_pad_limit = 0.5
tree_batch_auto_queue_min_docs = 8
tree_batch_auto_queue_min_fill_ratio = 0.5
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 2

[tradeoff_pipeline.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1
