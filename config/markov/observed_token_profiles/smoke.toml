# Smoke profile: minimal settings for fast tests and CI.
[observed_token_policy]
profile = "smoke"
generator_profile = "piecewise_palette"
n_regimes = 4
vocab_size = 16
min_tokens = 96
max_tokens = 96
min_segments = 2
max_segments = 6
min_seg_len = 8
max_seg_len = 24
fixed_leaf_tokens = 16
train_docs = 64
val_docs = 16
test_docs = 32
state_dim = 16
hidden_dim = 64
n_epochs = 4
batch_size = 8
lr = 5e-4
weight_decay = 0.0
seed = 0
device = "cpu"
torch_threads = 1
local_law_weight = 0.5
c1_relative_weight = 1.0
c2_relative_weight = 0.0
c3_relative_weight = 1.0
rf_n_estimators = 100
rf_max_depth = 8
rf_min_samples_leaf = 2
leaf_knn_neighbors = 32
doc_level_ridge_alpha = 1.0
doc_level_ridge_breakdown_orders = [1, 2, 3]
doc_sequence_objective = "count_ce_only"
doc_transformer_head_family = "boundary_sum_count_hybrid"
doc_transformer_layers = 4
