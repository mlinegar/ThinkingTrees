# t2048 composition-stress sweep
#
# Goal: stress merge composition with much longer trees (up to 127 merges per
# doc at fixed_leaf_tokens=16) on the recoverable_v5_t2048 benchmark, then ask
# whether composition supervision (leaf+internal) rescues sparse-root MAE the
# same way it does at t128.
#
# Headline cells:
#   - full10              (sparse root only) -> baseline showing merge-chain pain
#   - full10_leaf_full10_internal_count100   -> composition rescue under sparse root
#   - full100             (full root only) -> scale baseline
#   - full100_leaf_full100_internal_count100 -> upper bound
#
# 4 packages x 4 leaf sizes (chosen to span "1 leaf" through "128 leaves") x
# 1 seed = 16 cells. With per-rung batch sizes targeting ~16K leaves/batch.
#
# Bundle pre-generated by:
#   ./venv/bin/python scripts/prepare_markov_sticky_benchmark_data.py \
#       --benchmark-names recoverable_v5_t2048 --hardness-grid "" \
#       --train-doc-counts 10240 --seeds 0 \
#       --output-dir outputs/_bundles_t2048_pregen

[tradeoff_pipeline]
preset = "standard"
phases = ["supervision_recovery", "report"]
device_mode = "cuda"
train_docs = 10240
val_docs = 1024
test_docs = 1024
supervision_recovery_train_docs = [10240]
supervision_recovery_seeds = [0]
supervision_recovery_packages = [
  "full10",
  "full10_leaf_full10_internal_count100",
  "full100",
  "full100_leaf_full100_internal_count100",
]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_recoverable_benchmark = "recoverable_v5_t2048"
supervision_recovery_structural_cell = "r12_p079"
supervision_recovery_scope_keys = ["recoverable_v5_t2048"]
supervision_fixed_leaf_tokens = 16
# Leaf-size ladder spanning 1 leaf -> 128 leaves per 2048-token doc.
# Trimmed from the full 8-rung ladder to keep wall time tractable while
# still covering the composition-stress regime end-to-end.
supervision_recovery_leaf_token_ladder = [1024, 256, 64, 16]
# Per-rung batch sizes (in docs) targeting ~16K leaves per batch.
# leaf_tokens=1024 -> 2 leaves/doc -> bs=512 docs -> 1024 leaves/batch
# leaf_tokens=256  -> 8 leaves/doc -> bs=512 docs -> 4096 leaves/batch
# leaf_tokens=64   -> 32 leaves/doc -> bs=256 docs -> 8192 leaves/batch
# leaf_tokens=16   -> 128 leaves/doc -> bs=128 docs -> 16384 leaves/batch
supervision_recovery_leaf_token_batch_sizes = "1024=512;256=512;64=256;16=128"
supervision_min_tokens = 2048
supervision_max_tokens = 2048
supervision_epochs = 40
supervision_batch_size = 128
exact_metric_final_doc_limit = 256
tree_posttrain_train_doc_limit = 256
tree_stage1_artifact_root = "outputs/_stage1_artifacts/markov_t2048_composition_stress"

[tradeoff_pipeline.tree_reference]
mode = "preset"
preset = "unified_g_full_local_laws_v1"

[tradeoff_pipeline.structural_tree_reference]
mode = "preset"
preset = "unified_g_full_local_laws_v1"

[tradeoff_pipeline.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
tree_batch_structural_pad_limit = 0.5
tree_batch_auto_queue_min_docs = 8
tree_batch_auto_queue_min_fill_ratio = 0.5
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 2

[tradeoff_pipeline.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1
