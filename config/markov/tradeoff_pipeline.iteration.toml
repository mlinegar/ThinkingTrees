[tradeoff_pipeline]
preset = "standard"
phases = ["supervision_recovery", "report"]
device_mode = "cuda"
train_docs = 10240
val_docs = 1024
test_docs = 1024
supervision_recovery_train_docs = [1024, 2048, 4096, 10240]
supervision_recovery_seeds = [0, 1]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_structural_cell = "r12_p079"
medium_batch_sizes = [128, 256]
medium_seeds = [0]
docs_epochs_train_docs = [1024, 2048, 4096]
docs_epochs_epochs = [1, 3, 5]
learnability_train_docs = [1024, 2048, 4096]
learnability_weights = [0.0, 0.5]
learnability_profiles = ["pure_c2", "equal"]
weight_ablation_train_docs = [1024, 4096]
weight_ablation_profiles = ["root_only", "pure_c2", "equal"]
law_set_ids = ["root_only", "on_range_idempotence_only", "all"]
full_doc_anchor_train_docs = [1024, 2048, 4096]
full_doc_anchor_seeds = [0]
efficiency_anchor_mode = "both"
efficiency_train_docs = [2048, 4096]
efficiency_anchor_train_docs_dense = [256, 512, 768, 1024, 1536, 2048, 3072, 4096]
efficiency_anchor_seeds = [0, 1, 2]
efficiency_hardness_grid = "structural_core_v1"
efficiency_structural_cells = ["r4_p031", "r12_p031", "r4_p079", "r12_p079"]
oracle_budget_train_docs = 4096
oracle_budget_seeds = [0]
oracle_budget_calls_per_doc = [1.0]
oracle_budget_full_doc_shares = [0.5, 1.0]
oracle_budget_doc_consumption_modes = ["root_only", "doc_sequence"]
oracle_budget_local_split_modes = ["balanced"]

[tradeoff_pipeline.tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"
large_batch_batch_sizes = [256, 512, 1024]
large_batch_fixed_epochs = 5
large_batch_target_steps = 200
large_batch_lrs = [0.001, 0.002, 0.004]
support_leaf_tokens = [8, 16]
support_seeds = [0]
support_modes = ["supported"]

[tradeoff_pipeline.structural_tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"

[tradeoff_pipeline.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 1

[tradeoff_pipeline.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1

[[tradeoff_pipeline.full_doc_anchor_reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno"
law_set_id = "all"
role = "reference"

[[tradeoff_pipeline.full_doc_anchor_reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno_sumlen"
law_set_id = "all"
role = "reference"

[[tradeoff_pipeline.oracle_budget_method_runs]]
problem_id = "markov_ops_count"
method_id = "tree_neural"
law_set_id = "all"
role = "primary"

[[tradeoff_pipeline.oracle_budget_reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno"
law_set_id = "all"
role = "reference"

[[tradeoff_pipeline.oracle_budget_reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno_sumlen"
law_set_id = "all"
role = "reference"
