# Full t2048 grid with the new wide-heads default
# (state_dim=2048, hidden_dim=2048, tree_merge_hidden_dim=4096).
#
# Includes leaf=2048 (1 leaf, 0 merges = "just f") to validate the head
# capacity rule, then climbs the ladder of merge depths to test composition
# under the wide-heads regime.
#
# 4 packages * 5 leaf rungs * 1 seed = 20 cells.

[tradeoff_pipeline]
preset = "standard"
phases = ["supervision_recovery", "report"]
device_mode = "cuda"
train_docs = 10240
val_docs = 1024
test_docs = 1024
supervision_recovery_train_docs = [10240]
supervision_recovery_seeds = [0]
supervision_recovery_packages = [
  "full10",
  "full10_leaf_full10_internal_count100",
  "full100",
  "full100_leaf_full100_internal_count100",
]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_recoverable_benchmark = "recoverable_v5_t2048"
supervision_recovery_structural_cell = "r12_p079"
supervision_recovery_scope_keys = ["recoverable_v5_t2048"]
supervision_fixed_leaf_tokens = 16
# 5-rung ladder: zero merges, 1 merge, 7 merges, 31 merges, 127 merges.
supervision_recovery_leaf_token_ladder = [2048, 1024, 256, 64, 16]
# Per-rung batch sizes targeting ~16K leaves per batch.
# leaf=2048 -> 1 leaf/doc -> bs=512 docs (small target since each is just 1 leaf)
# leaf=1024 -> 2 leaves/doc -> bs=512 docs -> 1024 leaves/batch
# leaf=256  -> 8 leaves/doc -> bs=256 docs -> 2048 leaves/batch
# leaf=64   -> 32 leaves/doc -> bs=128 docs -> 4096 leaves/batch
# leaf=16   -> 128 leaves/doc -> bs=64 docs -> 8192 leaves/batch
# Reduced from prior ladder because state_dim=2048 model is much larger.
supervision_recovery_leaf_token_batch_sizes = "2048=512;1024=512;256=256;64=128;16=64"
supervision_min_tokens = 2048
supervision_max_tokens = 2048
supervision_epochs = 40
supervision_batch_size = 128
exact_metric_final_doc_limit = 256
tree_posttrain_train_doc_limit = 256
tree_stage1_artifact_root = "outputs/_stage1_artifacts/markov_t2048_full_grid_wide_heads"

[tradeoff_pipeline.tree_reference]
mode = "preset"
preset = "unified_g_full_local_laws_v1"

[tradeoff_pipeline.structural_tree_reference]
mode = "preset"
preset = "unified_g_full_local_laws_v1"

[tradeoff_pipeline.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
tree_batch_structural_pad_limit = 0.5
tree_batch_auto_queue_min_docs = 8
tree_batch_auto_queue_min_fill_ratio = 0.5
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1

[tradeoff_pipeline.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1
