[publication_bundle]
phases = ["tradeoff", "capacity", "parity", "tree_fno_pdf", "full_doc_parity_pdf", "bundle"]
with_preflight = true
reuse_existing = true

[publication_bundle.tradeoff]
preset = "standard"
device_mode = "cuda"
phases = ["supervision_recovery", "report"]
train_docs = 4096
supervision_recovery_train_docs = [1024, 2048, 4096]
supervision_recovery_seeds = [0, 1]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_structural_cell = "r12_p079"

[publication_bundle.tradeoff.tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"

[publication_bundle.tradeoff.structural_tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"

[publication_bundle.tradeoff.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 2

[publication_bundle.capacity]
benchmark = "recoverable_v4"
train_doc_count = 4096
screen_seeds = [0]
locked_seeds = [0]
top_k = 1
widths = [64, 128]
modes = [2, 4]
layers = [2, 4]

[publication_bundle.capacity.runtime]
data_mode = "resident"
bucket_mode = "exact_then_bucketed"
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 2

[publication_bundle.parity]
benchmark = "recoverable_v4"
gate_train_doc_count = 4096
scale_train_doc_counts = [1024, 2048, 4096]
seeds = [0]
run_aux_upper_bound = true
upper_bound_aux_fractions = [1.0]
backfill_on_success = false

[publication_bundle.parity.runtime]
data_mode = "resident"
bucket_mode = "exact_then_bucketed"
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = false
capacity_workers_per_mig = 2

[[publication_bundle.parity.method_runs]]
problem_id = "markov_ops_count"
method_id = "tree_neural"
law_set_id = "on_range_idempotence_only"
role = "primary"

[[publication_bundle.parity.method_runs]]
problem_id = "markov_ops_count"
method_id = "tree_neural"
law_set_id = "all"
role = "primary"

[[publication_bundle.parity.reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno"
law_set_id = "all"
role = "reference"

[[publication_bundle.parity.reference_method_runs]]
problem_id = "markov_ops_count"
method_id = "official_fno_sumlen"
law_set_id = "all"
role = "reference"

[publication_bundle.render]
render_full_doc_parity_pdf = true

[publication_bundle.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1

[tradeoff_pipeline]
preset = "standard"
phases = ["supervision_recovery", "report"]
train_docs = 4096
val_docs = 512
test_docs = 512
supervision_recovery_train_docs = [1024, 2048, 4096]
supervision_recovery_seeds = [0, 1]
supervision_recovery_method_id = "tree_neural"
supervision_recovery_structural_cell = "r12_p079"
medium_batch_sizes = [128, 256]
medium_seeds = [0]
law_set_ids = ["root_only", "on_range_idempotence_only", "all"]
support_modes = ["supported"]
efficiency_anchor_mode = "both"
efficiency_train_docs = [2048, 4096]
efficiency_anchor_train_docs_dense = [256, 512, 768, 1024, 1536, 2048, 3072, 4096]
efficiency_anchor_seeds = [0, 1, 2]
efficiency_hardness_grid = "structural_core_v1"
efficiency_structural_cells = ["r4_p031", "r12_p031", "r4_p079", "r12_p079"]
oracle_budget_train_docs = 4096
oracle_budget_seeds = [0]
oracle_budget_calls_per_doc = [1.0]
oracle_budget_full_doc_shares = [0.5, 1.0]
oracle_budget_doc_consumption_modes = ["root_only", "doc_sequence"]
oracle_budget_local_split_modes = ["balanced"]

[tradeoff_pipeline.tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"

[tradeoff_pipeline.structural_tree_reference]
mode = "preset"
capacity_root = ""
preset = "common_factorized_sketch_v1"

[tradeoff_pipeline.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 2

[tradeoff_pipeline.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1

[[tradeoff_pipeline.full_doc_anchor_reference_method_runs]]
