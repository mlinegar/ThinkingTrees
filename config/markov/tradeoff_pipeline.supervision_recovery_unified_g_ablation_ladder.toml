# Ablation ladder: canary → standard, one change at a time.
# Runs the same 1-leaf geometry (128-token docs, leaf=128) with 4 presets:
#   1. unified_g_fno_parity_canary_v1      (CE, single-stage, no laws) → FNO parity
#   2. unified_g_ablation_mse_v1           (MSE, single-stage, no laws) → MSE impact
#   3. unified_g_ablation_two_stage_v1     (MSE, two-stage, no laws)   → schedule impact
#   4. unified_g_ablation_local_laws_v1    (MSE, two-stage, full laws) → = standard
#
# Compare test_root_mae across presets to see which change breaks parity.
#
# NOTE: This config runs 4 separate experiments (one per preset) at the same
# leaf geometry. Use the output dirs to compare across presets.

[tradeoff_pipeline]
preset = "standard"
phases = ["supervision_recovery", "report"]
device_mode = "cuda"
train_docs = 10240
val_docs = 1024
test_docs = 1024
supervision_recovery_train_docs = [1024, 4096, 10240]
supervision_recovery_seeds = [0]
supervision_recovery_packages = ["full100"]
supervision_recovery_tree_family = "tree_neural"
supervision_recovery_recoverable_benchmark = "recoverable_v5_t128"
supervision_recovery_structural_grid = "structural_core_v2_t128"
supervision_recovery_structural_cell = "r12_p079"
supervision_fixed_leaf_tokens = 128
supervision_recovery_leaf_token_ladder = [128]
supervision_min_tokens = 128
supervision_max_tokens = 128
supervision_epochs = 40
exact_metric_final_doc_limit = 128
tree_posttrain_train_doc_limit = 128
tree_stage1_artifact_root = "outputs/_stage1_artifacts/markov_supervision_recovery_unified_g_ablation_ladder"

[tradeoff_pipeline.tree_reference]
mode = "preset"
preset = "PLACEHOLDER"

[tradeoff_pipeline.structural_tree_reference]
mode = "preset"
preset = "PLACEHOLDER"

[tradeoff_pipeline.runtime]
data_mode = "resident"
bucket_mode = "leaf_count_auto_queue"
tree_batch_structural_pad_limit = 0.5
tree_batch_auto_queue_min_docs = 8
tree_batch_auto_queue_min_fill_ratio = 0.5
preload_splits = ["train", "val", "test"]
preload_targets = true
workers_per_mig = 1
allow_multi_worker_screen = true
capacity_workers_per_mig = 2

[tradeoff_pipeline.scheduler]
mode = "global_per_run"
default_job_granularity = "family_train_seed"
cleanup_stale_children = true
max_gpu_items_per_mig = 1
