version: 1

# Manifesto q-sentence SUBSTRATE COMPARISON (dspy-vs-fno leaf-grid matrix).
#
# Replaces the ladder-invocation cells of the day2/overnight cluster:
#   scripts/run_overnight_substrate_comparison.sh
#   scripts/run_overnight_substrate_comparison_v2.sh
#   scripts/run_day2_substrate_comparison.sh
#   scripts/run_day2b_dgemma_smoke_leafgrid.sh
#   scripts/run_day2_fno_leafgrid.sh
#
# Each of those shells ALSO did fleet lifecycle (start/stop vLLM workers, swap
# DiffusionGemma <-> Gemma-4 on the GPUs) and a final substrate comparator. That
# GPU-serving orchestration is NOT expressed here — this bundle declares the
# comparison matrix (the ladder runs) as data; bring the fleet up separately
# (scripts/start_diffusiongemma_qsentence_worker.sh / scripts/start_vllm.sh) and
# run scripts/compare_manifesto_qsentence_substrates.py afterward over the
# output_dirs below.
#
# Launch a single run:
#   ./venv/bin/python scripts/run_manifesto_qsentence_bundle.py \
#     config/manifesto/qsentence_substrate_comparison.yaml \
#     --only dgemma_full_leafgrid
# Dry-run everything (no GPU/LLM):
#   ./venv/bin/python scripts/run_manifesto_qsentence_bundle.py \
#     config/manifesto/qsentence_substrate_comparison.yaml --dry-run

defaults:
  max_iterations: 2
  extra_args: ["--verbose"]

runs:
  # --- DiffusionGemma legs (fleet on ports 8004-8007, response_format guard) ---
  - name: dgemma_full_leaf1
    family: dspy
    grid_dir: outputs/manifesto_qsentence_dspy_labeled_grid
    leaf_qsentences: "1"
    target_dimensions: all
    output_dir: outputs/manifesto_qsentence_diffusiongemma_full_leaf1
    env:
      TT_DSPY_DROP_RESPONSE_FORMAT: "1"
    dspy:
      optimizer: gepa
      budget: light
      max_train_records: 2048
      model: openai/RedHatAI/diffusiongemma-26B-A4B-it-NVFP4
      api_base: http://localhost:8004/v1,http://localhost:8005/v1,http://localhost:8006/v1,http://localhost:8007/v1
      lm_context_tokens: 32768

  - name: dgemma_full_leafgrid
    family: dspy
    grid_dir: outputs/manifesto_qsentence_dspy_labeled_grid
    leaf_qsentences: "2,4,8,16"
    target_dimensions: all
    output_dir: outputs/manifesto_qsentence_diffusiongemma_full_leafgrid
    env:
      TT_DSPY_DROP_RESPONSE_FORMAT: "1"
      TT_SKIP_FULL_TREE_TRACES: "1"
    dspy:
      optimizer: gepa
      budget: light
      max_train_records: 2048
      num_threads: 640
      batch_max_concurrent: 1024
      model: openai/RedHatAI/diffusiongemma-26B-A4B-it-NVFP4
      api_base: http://localhost:8004/v1,http://localhost:8005/v1,http://localhost:8006/v1,http://localhost:8007/v1
      lm_context_tokens: 32768

  - name: dgemma_small_leafgrid
    family: dspy
    grid_dir: outputs/manifesto_qsentence_dspy_labeled_grid_smoke
    leaf_qsentences: "16,8,4,2"
    target_dimensions: all
    output_dir: outputs/manifesto_qsentence_diffusiongemma_small_leafgrid
    env:
      TT_DSPY_DROP_RESPONSE_FORMAT: "1"
    dspy:
      optimizer: gepa
      budget: light
      max_train_records: 2048
      num_threads: 640
      batch_max_concurrent: 1024
      model: openai/RedHatAI/diffusiongemma-26B-A4B-it-NVFP4
      api_base: http://localhost:8004/v1,http://localhost:8005/v1,http://localhost:8006/v1,http://localhost:8007/v1
      lm_context_tokens: 32768

  # --- Gemma-4-31B legs (AR model, ports 8010-8013, no response_format guard) ---
  - name: gemma4_small
    family: dspy
    grid_dir: outputs/manifesto_qsentence_dspy_labeled_grid_smoke
    leaf_qsentences: "1,2,4,8,16"
    target_dimensions: all
    output_dir: outputs/manifesto_qsentence_gemma4_small
    env:
      TT_DSPY_DROP_RESPONSE_FORMAT: "0"
    dspy:
      optimizer: gepa
      budget: light
      max_train_records: 2048
      num_threads: 640
      batch_max_concurrent: 1024
      model: openai/nvidia/Gemma-4-31B-IT-NVFP4
      api_base: http://localhost:8010/v1,http://localhost:8011/v1,http://localhost:8012/v1,http://localhost:8013/v1
      lm_context_tokens: 32768

  - name: gemma4_full_coarse
    family: dspy
    grid_dir: outputs/manifesto_qsentence_dspy_labeled_grid
    leaf_qsentences: "16,8,4,2"
    target_dimensions: all
    output_dir: outputs/manifesto_qsentence_gemma4_full_coarse
    env:
      TT_DSPY_DROP_RESPONSE_FORMAT: "0"
    dspy:
      optimizer: gepa
      budget: light
      max_train_records: 2048
      num_threads: 640
      batch_max_concurrent: 1024
      model: openai/nvidia/Gemma-4-31B-IT-NVFP4
      api_base: http://localhost:8010/v1,http://localhost:8011/v1,http://localhost:8012/v1,http://localhost:8013/v1
      lm_context_tokens: 32768

  # --- FNO leaf-size axis (CPU EmbeddingGemma; matches the LLM leaf grid) ---
  - name: fno_full_leafgrid
    family: fno
    grid_dir: outputs/manifesto_qsentence_dspy_labeled_grid
    leaf_qsentences: "16,8,4,2"
    output_dir: outputs/manifesto_qsentence_fno_embeddinggemma_full_leafgrid
    embedding:
      backend: local-hf
      model: /mnt/data/models/google/embeddinggemma-300m
      device: cpu
      batch_size: 64
    fno:
      epochs: 8
      batch_size: 16
      learning_rate: 3e-3
