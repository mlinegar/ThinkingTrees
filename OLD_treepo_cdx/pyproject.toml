[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treepo-cdx"
version = "0.1.0"
description = "Parallel CDX implementation of the TreePO/C-TreePO package spine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "TreePO Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
runtime = ["pyyaml>=6.0", "numpy>=1.24"]
all = ["treepo-cdx[dev,runtime]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["treepo_cdx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
